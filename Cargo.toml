[package]
name = "qe"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
karet-core = "0.7.1"
karet-editor = "0.7.1"
karet-syntax = { version = "0.7.1", features = ["lang-rust"] }
karet-text = "0.7.1"
karet-theme = "0.7.1"
karet-treesitter = "0.7.1"
ratatui = "0.30.2"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
